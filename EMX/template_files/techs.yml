Gasifier: &Gasifier #based on Restelli et al 2024 https://doi.org/10.1016/j.ijhydene.2023.10.107 
  type: RefNetworkNode
  capacity: 0
  OPEX_variable: 0 #keuro/ton-H2
  OPEX_fixed: 1.09e3 #kEUR/ton-H2/h, based on gasifer at H2 valleys in paper
  input:
    LH2: 1  # # LHV H2: 120 MJ/kg=120 GJ/ton=120e6 PJ/Mton
    # Power: 5.6e-4 # assuming 0 for our runs
  output:
    H2: 1 # PJ, 
  additional_data: [EmissionsData, InvestmentData]
  emissions_type: EmissionsEnergy
  invest_capacity_CAPEX: 4.5e2 # kEUR per ton-H2/h, based on gasifer at H2 valleys in paper
  invest_capacity_max_installed: 100000 # ton-H2
  invest_capacity_max_add: 9999 # ton-H2
  invest_capacity_min_add: 0
  invest_capacity_investment_mode: Continuous
  invest_capacity_lifetime_mode: Rolling
  invest_capacity_lifetime: 25 #years

Liquefier: &Liquefier #based on Restelli et al 2024 https://doi.org/10.1016/j.ijhydene.2023.10.107
  type: RefNetworkNode
  capacity: 0
  OPEX_variable: 0 # kEUR per ton-H2
  OPEX_fixed: 2.39e4 #kEUR/ton-H2/h,
  input:
    H2: 1
    Power: 0.25
  output:
    LH2: 1
  additional_data: [EmissionsData, InvestmentData]
  emissions_type: EmissionsEnergy
  invest_capacity_CAPEX: 6.43e4 # kEUR per ton-H2/h
  invest_capacity_max_installed: 100000 # ton/hr
  invest_capacity_max_add: 9999 # ton/hr
  invest_capacity_min_add: 0
  invest_capacity_investment_mode: Continuous
  invest_capacity_lifetime_mode: Rolling
  invest_capacity_lifetime: 25 #years

NH3_cracker: &NH3_cracker
  type: RefNetworkNode
  capacity: 0
  OPEX_variable: 0
  OPEX_fixed: 0
  input:
    NH3: 5.65 # ton-NH3 per ton-H2
  output:
    H2: 1
  additional_data: [EmissionsData, InvestmentData]
  emissions_type: EmissionsEnergy
  invest_capacity_CAPEX: 0 #TODO Dummy value to avoid investment, replace or do sensitivity analysis
  invest_capacity_max_installed: 0 # ton/hr
  invest_capacity_max_add: 0 # ton/hr
  invest_capacity_min_add: 0
  invest_capacity_investment_mode: Continuous
  invest_capacity_lifetime_mode: Rolling
  invest_capacity_lifetime: 30 #years